server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets de Vite llevan hash en el nombre: se pueden cachear para
    # siempre. index.html no, o el navegador pediría assets que ya no existen.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El backend es PHP-FPM: nginx le habla FastCGI. Las rutas son del
    # contenedor del backend, no de este.
    location /api/ {
        fastcgi_pass backend:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_param REQUEST_URI $request_uri;
        # Una sincronización manual de un repo grande puede tardar.
        fastcgi_read_timeout 120s;
    }
}
