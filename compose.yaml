name: jolo-pm

# Backend y worker son la misma imagen y la misma configuración; solo cambia el
# proceso que arrancan.
x-backend-env: &backend-env
  TZ: ${TZ:-Europe/Madrid}
  APP_NAME: jolo-PM
  APP_ENV: production
  APP_DEBUG: "false"
  LOG_CHANNEL: stderr
  DB_CONNECTION: sqlite
  DB_DATABASE: /data/jolo-pm.sqlite
  # Cifra las cookies de sesión y el secreto TOTP. Si cambia, hay que volver
  # a dar de alta el 2FA (php artisan auth:reset).
  APP_KEY: ${APP_KEY:?define APP_KEY en .env (ver README)}
  CACHE_STORE: file
  # Sesiones en la base de datos: sobreviven a reinicios del contenedor.
  SESSION_DRIVER: database
  SESSION_LIFETIME: ${SESSION_LIFETIME:-10080}
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
  QUEUE_CONNECTION: sync
  # `:?` para no arrancar con un token vacío y fallar en cada sincronización.
  GITHUB_TOKEN: ${GITHUB_TOKEN:?define GITHUB_TOKEN en .env (ver .env.example)}
  SYNC_CRON: ${SYNC_CRON:-*/5 * * * *}
  BLOB_TTL_DAYS: ${BLOB_TTL_DAYS:-30}

x-backend: &backend
  build:
    context: ./backend
  image: jolo-pm-backend
  user: "${PUID:-1000}:${PGID:-1000}"
  volumes:
    - ${JOLOPM_DATA_DIR:-./data}:/data
  restart: unless-stopped

services:
  frontend:
    build:
      context: ./frontend
    container_name: jolo-pm-frontend
    restart: unless-stopped
    ports:
      # Solo en localhost: se expone con un proxy inverso delante (las labels
      # de abajo son para un generador de vhosts de nginx).
      - "127.0.0.1:${JOLOPM_PORT:-8095}:80"
    labels:
      - "nginx.autoconf=true"
      - "nginx.domain=jolo-pm"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 32M

  backend:
    <<: *backend
    container_name: jolo-pm-backend
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "1"
    deploy:
      resources:
        limits:
          memory: 128M

  # Sincroniza todos los proyectos cada SYNC_CRON con el scheduler de Laravel.
  worker:
    <<: *backend
    container_name: jolo-pm-worker
    command: ["php", "artisan", "schedule:work"]
    environment: *backend-env
    init: true
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M
